<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Home</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3f1ed; color: #232028; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 360px; padding: 24px; text-align: center; }
    h1 { font-size: 22px; margin: 16px 0 6px; }
    p { color: #6b6672; margin: 0 0 18px; }
    button { height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: #232028; color: #fff; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="64" height="64" alt="" />
    <h1>You're offline</h1>
    <p>This page hasn't been opened on this device yet, so there's no saved copy. Pages, documents and trips you've opened before still work offline.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
